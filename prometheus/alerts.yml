          ) > 0.05
        for: 5m
        labels:
          severity: warning
          component: qdrant
        annotations:
          summary: "Qdrant error rate превышает 5%"
          description: "Error rate = {{ $value | humanizePercentage }} для операции {{ $labels.operation }}. Проверить логи и состояние Qdrant."

