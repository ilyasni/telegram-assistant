groups:
  # Recording rules для квантилей
  - name: crawl_latency_quantiles
    interval: 30s
    rules:
      - record: job:crawl_trigger_processing_latency_seconds:p95
        expr: histogram_quantile(0.95, sum by (le) (rate(crawl_trigger_processing_latency_seconds_bucket[5m])))
      
      - record: job:crawl_processing_seconds:p95
        expr: histogram_quantile(0.95, sum by (le) (rate(crawl_processing_seconds_bucket[5m])))

  # Alerts
  - name: crawl_pipeline
    interval: 30s
    rules:
      # PEL backlog критичен
      - alert: CrawlPELBacklogHigh
        expr: crawl_pel_backlog_current > 100
        for: 5m
        labels:
          severity: warning
          component: crawl_trigger
        annotations:
          summary: "Высокий PEL backlog ({{ $value }})"
          description: "PEL backlog для crawl trigger превышает 100 сообщений. Это может указывать на проблемы с обработкой сообщений. Проверить логи worker и состояние Redis streams."
      
      # Queue depth растёт
      - alert: CrawlTriggerQueueDepthHigh
        expr: crawl_trigger_queue_depth_current > 500
        for: 5m
        labels:
          severity: warning
          component: crawl_trigger
        annotations:
          summary: "Высокая глубина очереди триггера ({{ $value }})"
          description: "Глубина очереди crawl trigger превышает 500 сообщений. Проверить производительность crawl_trigger_task и обработку сообщений из stream:posts:tagged."
      
      # Error rate > 10%
      - alert: CrawlErrorRateHigh
        expr: |
          rate(crawl_requests_total{status="failed"}[5m])
          /
          rate(crawl_requests_total[5m]) > 0.10
        for: 5m
        labels:
          severity: critical
          component: crawl
        annotations:
          summary: "Crawl error-rate > 10%"
          description: "Error rate для crawl requests превышает 10%. Проверить логи crawl4ai и состояние внешних ресурсов."
      
      # p95 latency > 2s
      - alert: CrawlP95LatencyHigh
        expr: job:crawl_trigger_processing_latency_seconds:p95 > 2
        for: 10m
        labels:
          severity: warning
          component: crawl_trigger
        annotations:
          summary: "p95 latency триггера > 2s ({{ $value }})"
          description: "P95 latency обработки crawl trigger превышает 2 секунды. Проверить производительность обработки сообщений и состояние Redis."
      
      # TagPersistence PEL backlog
      - alert: TagPersistPELBacklogHigh
        expr: tags_persist_pel_backlog_current > 50
        for: 5m
        labels:
          severity: warning
          component: tag_persistence
        annotations:
          summary: "TagPersist PEL backlog высокий ({{ $value }})"
          description: "PEL backlog для tag persistence превышает 50 сообщений. Проверить логи worker и производительность БД операций."

  # Pipeline Coverage Alerts
  - name: pipeline_coverage
    interval: 30s
    rules:
      # Индексация: покрытие < 90%
      # Используем rate успешной индексации / rate успешного тегирования (ближайший proxy к общему парсингу)
      - alert: IndexingCoverageLow
        expr: |
          (
            sum(rate(indexing_processed_total{status="success"}[10m]))
            /
            (sum(rate(tagging_processed_total[10m])) + 1e-6)
          ) < 0.90
        for: 15m
        labels:
          severity: critical
          component: indexing
        annotations:
          summary: "Индексация < 90% (текущее: {{ $value | humanizePercentage }})"
          description: "Целевое покрытие: 90%+. Проверить логи worker и Qdrant."
      
      # Тегирование: покрытие < 80%
      # Используем rate успешного тегирования / rate успешного парсинга (stream_messages_total с phase=new)
      - alert: TaggingCoverageLow
        expr: |
          (
            sum(rate(tagging_processed_total{status="success"}[10m]))
            /
            (sum(rate(stream_messages_total{stream="posts.parsed", phase="new", status="ok"}[10m])) + 1e-6)
          ) < 0.80
        for: 15m
        labels:
          severity: warning
          component: tagging
        annotations:
          summary: "Тегирование < 80% (текущее: {{ $value | humanizePercentage }})"
          description: "Целевое покрытие: 80%+. Проверить AI провайдеры (GigaChat/OpenRouter)."
      
      # Redis Stream lag
      - alert: RedisStreamLagHigh
        expr: stream_pending_size{stream=~"posts\\.(parsed|tagged|enriched)"} > 1000
        for: 10m
        labels:
          severity: warning
          component: redis_streams
        annotations:
          summary: "Redis Stream lag высокий: {{ $labels.stream }} ({{ $value }} сообщений)"
          description: "Очередь растёт. Проверить производительность worker."
      
      # Worker задача упала
      - alert: WorkerTaskDown
        expr: up{job="worker"} == 0
        for: 2m
        labels:
          severity: critical
          component: worker
        annotations:
          summary: "Worker не отвечает на health check"
          description: "Worker контейнер недоступен. Проверить docker logs worker."
      
      # Индексация не обрабатывает события
      - alert: IndexingNoActivity
        expr: |
          sum(rate(indexing_processed_total[10m])) == 0
          and 
          sum(stream_pending_size{stream=~"posts\\.enriched"}) > 10
        for: 10m
        labels:
          severity: critical
          component: indexing
        annotations:
          summary: "Индексация не обрабатывает события (pending: {{ $value }})"
          description: "Есть события в posts.enriched, но indexing не обрабатывает. Проверить worker."
      
      # Тегирование не обрабатывает события
      - alert: TaggingNoActivity
        expr: |
          sum(rate(tagging_processed_total[10m])) == 0
          and 
          sum(stream_pending_size{stream=~"posts\\.parsed"}) > 10
        for: 10m
        labels:
          severity: warning
          component: tagging
        annotations:
          summary: "Тегирование не обрабатывает события (pending: {{ $value }})"
          description: "Есть события в posts.parsed, но tagging не обрабатывает. Проверить AI провайдеры."

  # Parsing Pipeline Alerts (Context7 Best Practices)
  - name: parsing_pipeline
    interval: 30s
    rules:
      # Парсинг не выполняется (нет активности)
      # Context7: Используем scheduler_heartbeat_seconds для проверки активности scheduler'а
      # и parser_runs_total для проверки активности парсинга
      - alert: ParsingNoActivity
        expr: |
          (
            (time() - scheduler_heartbeat_seconds) > 300
          )
          or
          (
            sum(rate(parser_runs_total[10m])) == 0
            and 
            (time() - scheduler_last_tick_ts_seconds) > 600
          )
        for: 15m
        labels:
          severity: critical
          component: parsing
        annotations:
          summary: "Парсинг не выполняется (нет активности)"
          description: "Парсер не обрабатывает каналы. Heartbeat: {{ $value }}s назад. Проверить логи telethon-ingest и состояние TelegramClientManager."
          runbook: "Проверить: 1) логи telethon-ingest, 2) статус TelegramClientManager, 3) scheduler_heartbeat_seconds, 4) scheduler_last_tick_ts_seconds"
      
      # Высокий error rate парсинга (> 20%)
      - alert: ParsingErrorRateHigh
        expr: |
          (
            sum(rate(parser_runs_total{status="failed"}[10m]))
            /
            (sum(rate(parser_runs_total[10m])) + 1e-6)
          ) > 0.20
        for: 10m
        labels:
          severity: warning
          component: parsing
        annotations:
          summary: "Parsing error rate превышает 20% ({{ $value | humanizePercentage }})"
          description: "Error rate парсинга = {{ $value | humanizePercentage }}. Проверить логи telethon-ingest и состояние Telegram API."
      
      # Высокая длительность обработки канала (p95 > 60 секунд)
      - alert: ParsingLatencyHigh
        expr: |
          histogram_quantile(0.95, 
            sum(rate(parser_channel_processing_seconds_bucket[10m])) by (le, mode)
          ) > 60
        for: 10m
        labels:
          severity: warning
          component: parsing
        annotations:
          summary: "Parsing p95 latency превышает 60 секунд ({{ $value | humanize }}s)"
          description: "P95 latency обработки канала = {{ $value | humanize }}s. Проверить производительность парсера и состояние Telegram API."
      
      # Нет новых постов за последний час при активном парсинге
      - alert: ParsingNoNewPosts
        expr: |
          sum(rate(posts_parsed_total{status="ok"}[1h])) == 0
          and 
          sum(rate(parser_runs_total[1h])) > 0
        for: 1h
        labels:
          severity: info
          component: parsing
        annotations:
          summary: "Нет новых постов за последний час при активном парсинге"
          description: "Парсер работает, но новых постов не обнаружено. Возможно, каналы неактивны или все посты уже обработаны."
      
      # Scheduler tick застрял (> 10 минут)
      - alert: SchedulerTickStuck
        expr: |
          (time() - scheduler_last_tick_ts_seconds) > 600
        for: 5m
        labels:
          severity: critical
          component: scheduler
        annotations:
          summary: "Scheduler tick застрял ({{ $value | humanize }}s с последнего тика)"
          description: "Последний тик scheduler был {{ $value | humanize }}s назад. Проверить логи telethon-ingest и состояние scheduler."
      
      # Heartbeat scheduler не обновляется (> 2 минуты)
      - alert: SchedulerHeartbeatStale
        expr: |
          (time() - scheduler_heartbeat_seconds) > 120
        for: 2m
        labels:
          severity: warning
          component: scheduler
        annotations:
          summary: "Scheduler heartbeat не обновляется ({{ $value | humanize }}s)"
          description: "Heartbeat scheduler не обновлялся {{ $value | humanize }}s. Проверить активность scheduler."

  # Vision Analysis Alerts (Context7 Best Practices)
  - name: vision_analysis
    interval: 30s
    rules:
      # Vision анализ не обрабатывает события
      # Context7: Используем vision_worker_processed_total (реальная метрика) и stream:posts:vision (реальный stream)
      - alert: VisionAnalysisNoActivity
        expr: |
          sum(rate(vision_worker_processed_total[10m])) == 0
          and 
          sum(stream_pending_size{stream=~"posts\\.vision"}) > 10
        for: 10m
        labels:
          severity: warning
          component: vision_analysis
        annotations:
          summary: "Vision анализ не обрабатывает события (pending: {{ $value }})"
          description: "Есть события в stream:posts:vision ({{ $value }}), но vision анализ не обрабатывает. Проверить логи worker и состояние GigaChat API."
      
      # Высокий error rate vision анализа (> 15%)
      # Context7: Используем vision_worker_processed_total (реальная метрика)
      - alert: VisionAnalysisErrorRateHigh
        expr: |
          (
            sum(rate(vision_worker_processed_total{status="error"}[10m]))
            /
            (sum(rate(vision_worker_processed_total[10m])) + 1e-6)
          ) > 0.15
        for: 10m
        labels:
          severity: warning
          component: vision_analysis
        annotations:
          summary: "Vision analysis error rate превышает 15% ({{ $value | humanizePercentage }})"
          description: "Error rate vision анализа = {{ $value | humanizePercentage }}. Проверить логи worker и состояние GigaChat API."
      
      # Высокая latency vision анализа (p95 > 30 секунд)
      # Context7: Используем vision_worker_duration_seconds (реальная метрика с label status)
      - alert: VisionAnalysisLatencyHigh
        expr: |
          histogram_quantile(0.95, 
            sum(rate(vision_worker_duration_seconds_bucket[10m])) by (le, status)
          ) > 30
        for: 10m
        labels:
          severity: warning
          component: vision_analysis
        annotations:
          summary: "Vision analysis p95 latency превышает 30 секунд ({{ $value | humanize }}s)"
          description: "P95 latency vision анализа = {{ $value | humanize }}s для status={{ $labels.status }}. Проверить производительность GigaChat API."
      
      # Низкое покрытие vision анализа (< 70%)
      # Context7: Используем vision_worker_processed_total{status="success"} и stream:posts:vision
      - alert: VisionAnalysisCoverageLow
        expr: |
          (
            sum(rate(vision_worker_processed_total{status="success"}[10m]))
            /
            (sum(rate(stream_messages_total{stream="posts.vision", phase="new", status="ok"}[10m])) + 1e-6)
          ) < 0.70
        for: 15m
        labels:
          severity: warning
          component: vision_analysis
        annotations:
          summary: "Vision analysis покрытие < 70% (текущее: {{ $value | humanizePercentage }})"
          description: "Целевое покрытие: 70%+. Проверить логи worker и состояние GigaChat API."

  # Album Pipeline Alerts (Phase 4)
  - name: album_pipeline
    interval: 30s
    rules:
      # Context7: Album assembly lag > 5 минут (критичная задержка)
      - alert: AlbumAssemblyLagHigh
        expr: |
          histogram_quantile(0.95, rate(album_assembly_lag_seconds_bucket[10m])) > 300
        for: 10m
        labels:
          severity: warning
          component: album_assembler
        annotations:
          summary: "Album assembly lag превышает 5 минут (p95: {{ $value | humanize }}s)"
          description: "Высокая задержка между первым и последним vision анализом элементов альбома. Проверить vision_analysis_task и album_assembler_task."
          runbook: "Проверить логи album_assembler_task и vision_analysis_task. Возможные причины: медленный vision анализ, проблемы с Redis state."
      
      # Context7: Album assembly lag критично > 10 минут
      - alert: AlbumAssemblyLagCritical
        expr: |
          histogram_quantile(0.95, rate(album_assembly_lag_seconds_bucket[10m])) > 600
        for: 5m
        labels:
          severity: critical
          component: album_assembler
        annotations:
          summary: "Album assembly lag критично высокий (p95: {{ $value | humanize }}s)"
          description: "Критическая задержка сборки альбомов. Требуется немедленное вмешательство."
      
      # Context7: Несоответствие количества элементов (items_analyzed < items_count)
      - alert: AlbumItemsCountMismatch
        expr: |
          sum(album_items_count_gauge{status="analyzed"}) by (album_id) < 
          sum(album_items_count_gauge{status="total"}) by (album_id) * 0.9
        for: 30m
        labels:
          severity: warning
          component: album_assembler
        annotations:
          summary: "Альбом не собрался полностью: проанализировано < 90% элементов"
          description: "Album {{ $labels.album_id }}: проанализировано {{ $value }} элементов, ожидалось больше. Проверить vision_analysis_task."
      
      # Context7: Album assembler не обрабатывает события
      - alert: AlbumAssemblerNoActivity
        expr: |
          sum(rate(albums_assembled_total[10m])) == 0
          and
          sum(rate(albums_parsed_total[10m])) > 0
        for: 15m
        labels:
          severity: warning
          component: album_assembler
        annotations:
          summary: "Album assembler не собирает альбомы"
          description: "События albums.parsed поступают, но album.assembled не эмитятся. Проверить album_assembler_task логи и Redis state."
      
      # Context7: Высокий backlog состояний альбомов в Redis
      - alert: AlbumStateBacklogHigh
        expr: |
          count(album_items_count_gauge{status="pending"}) > 50
        for: 10m
        labels:
          severity: warning
          component: album_assembler
        annotations:
          summary: "Высокий backlog альбомов в процессе сборки ({{ $value }} альбомов)"
          description: "Много альбомов ожидают завершения vision анализа. Проверить производительность vision_analysis_task."
      
      # Context7: Низкая скорость сборки альбомов
      - alert: AlbumAssemblyRateLow
        expr: |
          rate(albums_assembled_total{status="ok"}[10m]) < 0.1
          and
          rate(albums_parsed_total[10m]) > 0.5
        for: 15m
        labels:
          severity: warning
          component: album_assembler
        annotations:
          summary: "Низкая скорость сборки альбомов ({{ $value | humanize }} albums/min)"
          description: "Скорость сборки альбомов ниже ожидаемой при наличии входящих событий. Проверить vision_analysis_task."
      
      # Context7: Ошибки при сборке альбомов
      - alert: AlbumAssemblyErrorRateHigh
        expr: |
          (
            sum(rate(albums_assembled_total{status="error"}[5m]))
            /
            (sum(rate(albums_assembled_total[5m])) + 1e-6)
          ) > 0.05
        for: 10m
        labels:
          severity: warning
          component: album_assembler
        annotations:
          summary: "Высокий процент ошибок сборки альбомов ({{ $value | humanizePercentage }})"
          description: "Более 5% попыток сборки альбомов завершаются ошибкой. Проверить логи album_assembler_task."
      
      # Context7: Высокая длительность агрегации vision summary
      - alert: AlbumAggregationDurationHigh
        expr: |
          histogram_quantile(0.95, rate(album_aggregation_duration_ms_bucket[10m])) > 5000
        for: 10m
        labels:
          severity: warning
          component: album_assembler
        annotations:
          summary: "Высокая длительность агрегации vision summary (p95: {{ $value | humanize }}ms)"
          description: "Агрегация vision summary занимает слишком много времени. Проверить производительность _aggregate_vision_summary."

  # Context7: System stability alerts
  - name: system_stability
    interval: 30s
    rules:
      # Scheduler не запущен
      - alert: SchedulerNotRunning
        expr: scheduler_running == 0
        for: 1m
        labels:
          severity: critical
          component: scheduler
        annotations:
          summary: "Scheduler не запущен более 1 минуты"
          description: "Scheduler должен автоматически запускаться при старте API"
      
      # Scheduler Freshness слишком высокий (парсинг каналов)
      # Context7: Используем clamp_max для ограничения максимального значения (24 часа)
      # и проверяем наличие метрики и что она не равна 0
      - alert: SchedulerFreshnessHigh
        expr: |
          count(scheduler_last_tick_ts_seconds) > 0
          and
          scheduler_last_tick_ts_seconds > 0
          and
          clamp_max(time() - scheduler_last_tick_ts_seconds, 86400) > 600
        for: 2m
        labels:
          severity: warning
          component: scheduler
        annotations:
          summary: "Scheduler Freshness превысил 10 минут ({{ $value | humanizeDuration }})"
          description: "Scheduler парсинга каналов не обновлялся {{ $value | humanizeDuration }}. Последний tick был слишком давно."
      
      # Scheduler Freshness критически высокий
      # Context7: Используем clamp_max для ограничения максимального значения (24 часа)
      # и проверяем наличие метрики и что она не равна 0
      - alert: SchedulerFreshnessCritical
        expr: |
          count(scheduler_last_tick_ts_seconds) > 0
          and
          scheduler_last_tick_ts_seconds > 0
          and
          clamp_max(time() - scheduler_last_tick_ts_seconds, 86400) > 900
        for: 3m
        labels:
          severity: critical
          component: scheduler
        annotations:
          summary: "Scheduler Freshness критически высокий ({{ $value | humanizeDuration }})"
          description: "Scheduler парсинга каналов не обновлялся {{ $value | humanizeDuration }}. Возможно, scheduler застрял или завис."
      
      # Scheduler Heartbeat отсутствует (более 60 секунд)
      # Context7: Используем clamp_max для ограничения максимального значения (24 часа)
      # и проверяем наличие метрики и что она не равна 0
      - alert: SchedulerHeartbeatMissing
        expr: |
          count(scheduler_heartbeat_seconds) > 0
          and
          scheduler_heartbeat_seconds > 0
          and
          clamp_max(time() - scheduler_heartbeat_seconds, 86400) > 60
        for: 1m
        labels:
          severity: warning
          component: scheduler
        annotations:
          summary: "Scheduler Heartbeat отсутствует более 60 секунд"
          description: "Scheduler heartbeat не обновлялся {{ $value | humanizeDuration }}. Возможно, scheduler завис или остановился."
      
      # Health checks падают
      - alert: HealthCheckFailuresHigh
        expr: rate(health_check_failures_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
          component: health
        annotations:
          summary: "Health checks падают: {{ $value }} ошибок/сек"
          description: "Более 5 ошибок health checks подряд"
      
      # Pending сообщений в streams
      - alert: RedisStreamPendingHigh
        expr: redis_stream_pending_messages > 100
        for: 5m
        labels:
          severity: warning
          component: redis_streams
        annotations:
          summary: "Высокое количество pending сообщений: {{ $value }}"
          description: "Более 100 pending сообщений в Redis streams"
      
      # Контейнеры перезапускаются
      - alert: ContainerRestartsHigh
        expr: rate(container_restart_count_total[1h]) > 3
        for: 1h
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Контейнер {{ $labels.service_name }} перезапускается слишком часто"
          description: "Более 3 перезапусков в час"

  # Graph Writer Alerts
  - name: graph_writer
    interval: 30s
    rules:
      - alert: GraphWriterNoActivity
        expr: |
          sum(rate(graph_writer_processed_total[10m])) == 0
          and
          sum(graph_writer_pel_size) > 10
        for: 10m
        labels:
          severity: critical
          component: graph_writer
        annotations:
          summary: "Graph writer не обрабатывает события"
          description: "Есть pending сообщения ({{ $value }}), но graph writer не обрабатывает. Проверить логи worker и состояние Neo4j."

      - alert: GraphWriterErrorRateHigh
        expr: |
          (
            sum(rate(graph_writer_processed_total{status="error"}[5m]))
            /
            (sum(rate(graph_writer_processed_total[5m])) + 1e-6)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          component: graph_writer
        annotations:
          summary: "Graph writer error rate превышает 5%"
          description: "Error rate = {{ $value | humanizePercentage }}. Проверить логи worker и состояние Neo4j."

      - alert: GraphWriterPELBacklogHigh
        expr: sum(graph_writer_pel_size) > 100
        for: 5m
        labels:
          severity: warning
          component: graph_writer
        annotations:
          summary: "Graph writer PEL backlog высокий ({{ $value }} сообщений)"
          description: "Требуется проверка производительности graph writer."

  # Post Persistence Alerts
  - name: post_persistence
    interval: 30s
    rules:
      - alert: PostPersistenceNoActivity
        expr: |
          sum(rate(post_persistence_processed_total[10m])) == 0
          and
          sum(post_persistence_pel_size) > 10
        for: 10m
        labels:
          severity: critical
          component: post_persistence
        annotations:
          summary: "Post persistence не обрабатывает события"
          description: "Есть pending сообщения ({{ $value }}), но post persistence не обрабатывает. Проверить логи worker и состояние БД."

      - alert: PostPersistenceErrorRateHigh
        expr: |
          (
            sum(rate(post_persistence_processed_total{status="error"}[5m]))
            /
            (sum(rate(post_persistence_processed_total[5m])) + 1e-6)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          component: post_persistence
        annotations:
          summary: "Post persistence error rate превышает 5%"
          description: "Error rate = {{ $value | humanizePercentage }}. Проверить логи worker и состояние БД."

      - alert: PostPersistenceLatencyHigh
        expr: |
          histogram_quantile(0.95, rate(post_persistence_latency_seconds_bucket[5m])) > 5
        for: 10m
        labels:
          severity: warning
          component: post_persistence
        annotations:
          summary: "Post persistence p95 latency превышает 5 секунд"
          description: "P95 latency = {{ $value }}s. Проверить производительность БД."

  # PostgreSQL Alerts
  - name: postgres
    interval: 30s
    rules:
      - alert: PostgresUnavailable
        # Context7: Проверяем доступность PostgreSQL
        # Если оба сервиса (api и worker) недоступны - это критично
        # Или если есть метрики ошибок подключения
        expr: |
          (
            up{job="api"} == 0
            and
            up{job="worker"} == 0
          )
          or
          (
            count(postgres_operations_total) > 0
            and
            sum(rate(postgres_operations_total{status="error", operation=~".*connect.*|.*connection.*"}[5m])) > 0
          )
        for: 5m
        labels:
          severity: critical
          component: postgres
        annotations:
          summary: "PostgreSQL недоступен"
          description: |
            PostgreSQL недоступен или сервисы не могут подключиться.
            Проверить:
            1. Состояние БД: docker ps | grep postgres
            2. Логи: docker logs telegram-assistant-supabase-db-1
            3. Метрики: curl http://localhost:9090/api/v1/query?query=postgres_operations_total

      - alert: PostgresLatencyHigh
        expr: |
          histogram_quantile(0.95, sum(rate(postgres_operation_duration_seconds_bucket[5m])) by (le, operation)) > 1
        for: 5m
        labels:
          severity: warning
          component: postgres
        annotations:
          summary: "PostgreSQL p95 latency превышает 1 секунду"
          description: "P95 latency = {{ $value }}s для операции {{ $labels.operation }}. Проверить производительность БД."

      - alert: PostgresErrorRateHigh
        expr: |
          (
            sum(rate(postgres_operations_total{status="error"}[5m])) by (operation)
            /
            (sum(rate(postgres_operations_total[5m])) by (operation) + 1e-6)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          component: postgres
        annotations:
          summary: "PostgreSQL error rate превышает 5%"
          description: "Error rate = {{ $value | humanizePercentage }} для операции {{ $labels.operation }}. Проверить логи и состояние БД."

      - alert: PostgresConnectionsHigh
        expr: |
          (
            sum(postgres_connections_active)
            /
            (sum(postgres_connections_max) + 1e-6)
          ) > 0.80
        for: 5m
        labels:
          severity: warning
          component: postgres
        annotations:
          summary: "PostgreSQL connections превышают 80% от лимита"
          description: "Использование соединений = {{ $value | humanizePercentage }}. Проверить connection pool."

