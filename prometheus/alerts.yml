        labels:
          severity: warning
          component: dlq
        annotations:
          summary: "DLQ auto-heal success rate ниже 50%"
          description: "Success rate = {{ $value | humanizePercentage }}. Проверить причины неудачных попыток auto-heal."

  # API Endpoints Alerts
  - name: api_endpoints
    interval: 30s
    rules:
      - alert: APIEndpointLatencyHigh
        expr: |
          histogram_quantile(0.95, 
            rate(api_endpoint_latency_seconds_bucket{endpoint=~"/api/(channels|sessions|digest|trends|admin).*"}[5m])
          ) > 5
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "API endpoint p95 latency превышает 5 секунд"
          description: "P95 latency для {{ $labels.endpoint }} = {{ $value }}s. Проверить производительность endpoint."

      - alert: APIEndpointErrorRateHigh
        expr: |
          (
            sum(rate(api_endpoint_requests_total{status_code=~"5..", endpoint=~"/api/(channels|sessions|digest|trends|admin).*"}[5m])) by (endpoint, method)
            /
            (sum(rate(api_endpoint_requests_total{endpoint=~"/api/(channels|sessions|digest|trends|admin).*"}[5m])) by (endpoint, method) + 1e-6)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "API endpoint error rate превышает 5%"
          description: "Error rate для {{ $labels.endpoint }} = {{ $value | humanizePercentage }}. Проверить логи API."

  # Redis Alerts
  - name: redis
    interval: 30s
    rules:
      - alert: RedisUnavailable
        # Context7: Проверяем доступность Redis
        # Если оба сервиса (api и worker) недоступны - это критично
        # Или если есть метрики ошибок подключения
        expr: |
          (
            up{job="worker"} == 0
            and
            up{job="api"} == 0
          )
          or
          (
            count(redis_operations_total) > 0
            and
            sum(rate(redis_operations_total{status="error", operation=~".*connect.*|.*ping.*"}[5m])) > 0
          )
        for: 5m
        labels:
          severity: critical
          component: redis
        annotations:
          summary: "Redis недоступен"
          description: |
            Redis недоступен или сервисы не могут подключиться.
            Проверить:
            1. Состояние Redis: docker ps | grep redis
            2. Ping: docker exec telegram-assistant-redis-1 redis-cli ping
            3. Метрики: curl http://localhost:9090/api/v1/query?query=redis_operations_total

      - alert: RedisMemoryHigh
        expr: |
          (
            sum(redis_memory_usage_bytes) by (instance)
            /
            (sum(redis_memory_max_bytes) by (instance) + 1e-6)
          ) > 0.80
        for: 5m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Redis использование памяти превышает 80%"
          description: "Использование памяти = {{ $value | humanizePercentage }}. Проверить использование памяти и настройки eviction. Команда: redis-cli INFO memory"
