<!-- [C7-ID: MINIAPP-THEMES-001] Страница управления подборками -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подборки каналов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/css/miniapp.css">
    <style>
        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        
        .themes-list {
            margin-bottom: 20px;
        }
        
        .theme-card {
            background: var(--tg-theme-secondary-bg-color, #f8f8f8);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .theme-info h3 {
            margin: 0 0 4px 0;
            font-size: 16px;
            font-weight: 600;
        }
        
        .theme-info p {
            margin: 4px 0;
            font-size: 14px;
            color: var(--tg-theme-hint-color, #666666);
        }
        
        .theme-meta {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 8px;
            font-size: 12px;
            color: var(--tg-theme-hint-color, #666666);
        }
        
        .badge-subscribed {
            background: #34c759;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
        }
        
        .theme-actions {
            display: flex;
            gap: 8px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        .btn:hover {
            opacity: 0.8;
        }
        
        .btn-primary {
            background: var(--tg-theme-button-color, #007aff);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
        
        .btn-secondary {
            background: var(--tg-theme-hint-color, #cccccc);
            color: var(--tg-theme-text-color, #000000);
        }
        
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--tg-theme-secondary-bg-color, #f8f8f8);
            color: var(--tg-theme-text-color, #000000);
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 1001;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .toast.show {
            opacity: 1;
        }
        
        .toast.success {
            background: #34c759;
            color: white;
        }
        
        .toast.error {
            background: #ff3b30;
            color: white;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--tg-theme-hint-color, #666666);
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--tg-theme-hint-color, #666666);
        }
        
        .empty-state h3 {
            margin: 0 0 8px 0;
            font-size: 18px;
        }
        
        .empty-state p {
            margin: 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <h1>📚 Подборки каналов</h1>
        </div>
        
        <div id="themes-list">
            <div class="loading">Загрузка подборок...</div>
        </div>
        
        <div id="toast" class="toast"></div>
    </div>
    
    <script src="/static/js/themes.js"></script>
</body>
</html>
