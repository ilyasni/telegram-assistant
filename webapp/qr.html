<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Assistant — QR вход</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        :root {
            --tg-bg-color: #ffffff;
            --tg-text-color: #000000;
            --tg-button-color: #2481cc;
            --tg-button-text-color: #ffffff;
            --tg-hint-color: #999999;
            --tg-link-color: #2481cc;
            --tg-section-bg-color: #f8f8f8;
            --tg-header-bg-color: #ffffff;
            --tg-destructive-color: #ff3b30;
            --tg-accent-color: #2481cc;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --tg-bg-color: #17212b;
                --tg-text-color: #f5f5f5;
                --tg-button-color: #5288c1;
                --tg-button-text-color: #ffffff;
                --tg-hint-color: #708499;
                --tg-link-color: #6ab3f3;
                --tg-section-bg-color: #232e3c;
                --tg-header-bg-color: #17212b;
                --tg-destructive-color: #ec3942;
                --tg-accent-color: #6ab2f2;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-bg-color);
            color: var(--tg-text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--tg-text-color);
        }

        .header p {
            font-size: 16px;
            color: var(--tg-hint-color);
        }

        .status {
            text-align: center;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-weight: 500;
            transition: all 0.3s ease;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status.loading {
            background-color: var(--tg-section-bg-color);
            color: var(--tg-text-color);
        }

        .status.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .qr-container {
            text-align: center;
            margin-bottom: 24px;
            min-height: 300px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .qr-container.show {
            opacity: 1;
            visibility: visible;
        }

        /* Context7: полностью скрываем QR контейнер когда показывается форма пароля */
        .qr-container.hidden {
            display: none !important;
            min-height: 0 !important;
            margin-bottom: 0 !important;
        }

        .qr-code {
            background-color: var(--tg-section-bg-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
        }

        .qr-code img {
            width: 260px;
            height: 260px;
            border-radius: 8px;
            object-fit: contain;
        }

        .qr-code canvas {
            width: 260px;
            height: 260px;
            border-radius: 8px;
        }

        .qr-instructions {
            color: var(--tg-hint-color);
            font-size: 14px;
            margin-top: 12px;
        }

        .button {
            background-color: var(--tg-button-color);
            color: var(--tg-button-text-color);
            border: none;
            border-radius: 12px;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 16px;
            min-height: 56px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .button.show {
            opacity: 1;
            visibility: visible;
        }

        .button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Context7: стили для формы ввода 2FA пароля */
        .password-form {
            margin-top: 16px;
            padding: 16px;
            background-color: var(--tg-section-bg-color);
            border-radius: 12px;
            text-align: left;
            display: block;
            width: 100%;
            box-sizing: border-box;
        }

        .password-form h3 {
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--tg-text-color);
            font-size: 18px;
            font-weight: 600;
        }

        .password-form p {
            color: var(--tg-hint-color);
            font-size: 14px;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .password-form input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--tg-section-bg-color);
            margin-bottom: 12px;
            font-size: 14px;
            background-color: var(--tg-bg-color);
            color: var(--tg-text-color);
            box-sizing: border-box;
        }

        .password-form input:focus {
            outline: none;
            border-color: var(--tg-accent-color);
        }

        .password-form button {
            width: 100%;
            margin-top: 0;
        }

        .password-form #password-error {
            margin-top: 12px;
            color: var(--tg-destructive-color);
            font-size: 14px;
            display: none;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 480px) {
            .container {
                padding: 16px;
            }

            .header h1 {
                font-size: 20px;
            }

            .qr-code {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div id="qr-auth-section" class="container">
        <div class="header">
            <h1>🔐 Авторизация</h1>
            <p>Перейдите в Настройки → Устройства и отсканируйте QR-код</p>
        </div>

        <div id="status" class="status loading">
            Инициализация...
        </div>

        <div id="qr-container" class="qr-container">
            <div class="qr-code" id="qr-code">
                <div style="color: var(--tg-hint-color); font-size: 16px;">Загрузка QR-кода...</div>
            </div>
            <div class="qr-instructions">
                Отсканируйте QR-код в Telegram
            </div>
        </div>

        <!-- Context7: Форма для ввода 2FA пароля -->
        <div id="password-form" class="password-form hidden">
            <h3 style="margin-top: 0; margin-bottom: 12px; color: var(--tg-text-color);">🔐 Требуется пароль 2FA</h3>
            <p style="color: var(--tg-hint-color); font-size: 14px; margin-bottom: 16px; line-height: 1.4;">
                Введите пароль двухфакторной аутентификации для завершения входа
            </p>
            <input 
                type="password" 
                id="password-input" 
                placeholder="Пароль 2FA" 
                style="width: 100%; padding: 12px; border: 1px solid var(--tg-section-bg-color); border-radius: 8px; font-size: 14px; margin-bottom: 12px; background-color: var(--tg-section-bg-color); color: var(--tg-text-color);"
                autocomplete="current-password"
            />
            <button id="btn-submit-password" class="button show" style="margin-top: 0;">
                Отправить пароль
            </button>
            <div id="password-error" style="margin-top: 12px; color: var(--tg-destructive-color); font-size: 14px; display: none;"></div>
        </div>

        <button id="cancel-btn" class="button" onclick="cancelAuth()">
            Отменить
        </button>
    </div>

    <script>
        (function() {
            'use strict';

            const API_BASE = (window.location.origin.includes('produman.studio') || window.location.origin.startsWith('https://produman.studio'))
                ? 'https://produman.studio'
                : '';
            const urlParams = new URLSearchParams(window.location.search);
            const fallbackToken = urlParams.get('token') || '';
            let sessionToken = null;
            let statusCheckInterval = null;
            let tenantId = null;
            let telegramUserId = null;
            let cachedInitData = '';
            let cachedInitDataUnsafe = null;
            let cachedAuthPayload = null;

            function getThemeColors() {
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.themeParams) {
                    const theme = window.Telegram.WebApp.themeParams;
                    return {
                        bgColor: theme.bg_color || '#ffffff',
                        textColor: theme.text_color || '#000000',
                        buttonColor: theme.button_color || '#2481cc',
                        buttonTextColor: theme.button_text_color || '#ffffff',
                        hintColor: theme.hint_color || '#999999',
                        linkColor: theme.link_color || '#2481cc',
                        sectionBgColor: theme.section_bg_color || '#f8f8f8',
                        headerBgColor: theme.header_bg_color || '#ffffff',
                        destructiveColor: theme.destructive_text_color || '#ff3b30',
                        accentColor: theme.accent_text_color || '#2481cc'
                    };
                }
                return null;
            }

            function applyTheme() {
                const theme = getThemeColors();
                if (theme) {
                    const root = document.documentElement;
                    root.style.setProperty('--tg-bg-color', theme.bgColor);
                    root.style.setProperty('--tg-text-color', theme.textColor);
                    root.style.setProperty('--tg-button-color', theme.buttonColor);
                    root.style.setProperty('--tg-button-text-color', theme.buttonTextColor);
                    root.style.setProperty('--tg-hint-color', theme.hintColor);
                    root.style.setProperty('--tg-link-color', theme.linkColor);
                    root.style.setProperty('--tg-section-bg-color', theme.sectionBgColor);
                    root.style.setProperty('--tg-header-bg-color', theme.headerBgColor);
                    root.style.setProperty('--tg-destructive-color', theme.destructiveColor);
                    root.style.setProperty('--tg-accent-color', theme.accentColor);
                }
            }

            function initTelegramWebApp() {
                if (window.Telegram && window.Telegram.WebApp) {
                    // Context7: безопасный вызов ready() - базовый метод, должен быть всегда
                    if (typeof window.Telegram.WebApp.ready === 'function') {
                        window.Telegram.WebApp.ready();
                    }
                    
                    // Context7: безопасный вызов expand() - базовый метод
                    if (typeof window.Telegram.WebApp.expand === 'function') {
                        window.Telegram.WebApp.expand();
                    }
                    
                    // Context7: setHeaderColor может не поддерживаться в старых версиях
                    if (typeof window.Telegram.WebApp.setHeaderColor === 'function') {
                        try {
                            window.Telegram.WebApp.setHeaderColor('bg_color');
                        } catch (e) {
                            console.warn('[QR] setHeaderColor not supported:', e);
                        }
                    }
                    
                    // Context7: setBackgroundColor может не поддерживаться в старых версиях
                    if (typeof window.Telegram.WebApp.setBackgroundColor === 'function') {
                        try {
                            window.Telegram.WebApp.setBackgroundColor('bg_color');
                        } catch (e) {
                            console.warn('[QR] setBackgroundColor not supported:', e);
                        }
                    }
                    
                    applyTheme();
                    
                    // Context7: onEvent может не поддерживаться в старых версиях
                    if (typeof window.Telegram.WebApp.onEvent === 'function') {
                        try {
                            window.Telegram.WebApp.onEvent('themeChanged', applyTheme);
                            // Context7: добавляем обработчик для получения initData когда он станет доступен
                            window.Telegram.WebApp.onEvent('viewportChanged', () => {
                                // Когда viewport изменяется, initData может стать доступен
                                const data = getInitData();
                                if (isValidInitData(data) && !cachedInitData) {
                                    cachedInitData = data;
                                    console.log('[QR] initData received via viewportChanged event');
                                }
                            });
                        } catch (e) {
                            console.warn('[QR] onEvent not supported:', e);
                        }
                    }
                    
                    // Context7: периодически проверяем появление initData (fallback для случаев, когда события не срабатывают)
                    if (!window._initDataPollInterval) {
                        window._initDataPollInterval = setInterval(() => {
                            if (!cachedInitData || !isValidInitData(cachedInitData)) {
                                const data = getInitData();
                                if (isValidInitData(data)) {
                                    cachedInitData = data;
                                    console.log('[QR] initData received via polling');
                                    clearInterval(window._initDataPollInterval);
                                    window._initDataPollInterval = null;
                                }
                            } else {
                                clearInterval(window._initDataPollInterval);
                                window._initDataPollInterval = null;
                            }
                        }, 500);
                        // Останавливаем polling через 30 секунд
                        setTimeout(() => {
                            if (window._initDataPollInterval) {
                                clearInterval(window._initDataPollInterval);
                                window._initDataPollInterval = null;
                            }
                        }, 30000);
                    }
                }
            }

            function getInitDataFromUrl() {
                try {
                    const searchParams = new URLSearchParams(window.location.search);
                    const tgParam = searchParams.get('tgWebAppData');
                    if (tgParam) {
                        const decoded = decodeURIComponent(tgParam);
                        if (decoded && decoded.includes('=')) {
                            console.log('[QR] initData extracted from URL search, length:', decoded.length);
                            return decoded;
                        }
                    }

                    if (window.location.hash && window.location.hash.includes('tgWebAppData=')) {
                        const hashParams = new URLSearchParams(window.location.hash.replace('#', ''));
                        const tgParamHash = hashParams.get('tgWebAppData');
                        if (tgParamHash) {
                            const decodedHash = decodeURIComponent(tgParamHash);
                            if (decodedHash && decodedHash.includes('=')) {
                                console.log('[QR] initData extracted from URL hash, length:', decodedHash.length);
                                return decodedHash;
                            }
                        }
                    }
                } catch (error) {
                    console.error('[QR] Failed to extract initData from URL:', error);
                }
                return '';
            }

            function sortObjectDeep(value) {
                if (Array.isArray(value)) {
                    return value.map(sortObjectDeep);
                }
                if (value && typeof value === 'object') {
                    const sorted = {};
                    Object.keys(value)
                        .sort()
                        .forEach((key) => {
                            sorted[key] = sortObjectDeep(value[key]);
                        });
                    return sorted;
                }
                return value;
            }

            function buildInitDataFromUnsafe(unsafe) {
                if (!unsafe || typeof unsafe !== 'object') {
                    return '';
                }
                const parts = [];
                Object.keys(unsafe).sort().forEach((key) => {
                    const value = unsafe[key];
                    if (value === undefined || value === null) {
                        return;
                    }
                    if (typeof value === 'object') {
                        parts.push(`${key}=${encodeURIComponent(JSON.stringify(sortObjectDeep(value)))}`);
                    } else {
                        parts.push(`${key}=${encodeURIComponent(String(value))}`);
                    }
                });
                if (parts.length === 0) {
                    return '';
                }
                return parts.join('&');
            }

            function isValidInitData(data) {
                if (!data || typeof data !== 'string') {
                    return false;
                }
                const trimmed = data.trim();
                if (trimmed.length === 0 || trimmed === '{}') {
                    return false;
                }
                return trimmed.includes('=');
            }

            function getInitData() {
                if (cachedInitData && isValidInitData(cachedInitData)) {
                    return cachedInitData;
                }

                const urlInitData = getInitDataFromUrl();
                if (isValidInitData(urlInitData)) {
                    cachedInitData = urlInitData;
                    return cachedInitData;
                }
                if (window.Telegram?.WebApp?.initData && isValidInitData(window.Telegram.WebApp.initData)) {
                    cachedInitData = window.Telegram.WebApp.initData;
                    return cachedInitData;
                }

                const unsafe = getInitDataUnsafe();
                if (unsafe) {
                    const built = buildInitDataFromUnsafe(unsafe);
                    if (isValidInitData(built)) {
                        cachedInitData = built;
                        console.log('[QR] Built initData from initDataUnsafe, length:', cachedInitData.length);
                        return cachedInitData;
                    }
                }

                return '';
            }

            async function waitForInitData(maxAttempts = 30, delayMs = 150) {
                // Context7: увеличиваем количество попыток для новых пользователей
                for (let attempt = 0; attempt < maxAttempts; attempt++) {
                    const data = getInitData();
                    if (isValidInitData(data)) {
                        console.log(`[QR] initData found on attempt ${attempt + 1}`);
                        return data;
                    }
                    if (attempt === 0) {
                        console.log('[QR] Waiting for initData...', {
                            Telegram: !!window.Telegram,
                            WebApp: !!window.Telegram?.WebApp,
                            initData: !!window.Telegram?.WebApp?.initData,
                            initDataUnsafe: !!window.Telegram?.WebApp?.initDataUnsafe
                        });
                    }
                    await new Promise(resolve => setTimeout(resolve, delayMs));
                }
                console.error('[QR] initData not found after', maxAttempts, 'attempts');
                return '';
            }

            function getInitDataUnsafe() {
                if (cachedInitDataUnsafe) {
                    return cachedInitDataUnsafe;
                }
                if (window.Telegram?.WebApp?.initDataUnsafe) {
                    cachedInitDataUnsafe = window.Telegram.WebApp.initDataUnsafe;
                    return cachedInitDataUnsafe;
                }
                return null;
            }

            function parseJWT(token) {
                if (!token) {
                    throw new Error('JWT token is empty');
                }
                const parts = token.split('.');
                if (parts.length !== 3) {
                    throw new Error('Invalid token format');
                }
                let payloadBase64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
                while (payloadBase64.length % 4) {
                    payloadBase64 += '=';
                }
                const decoded = atob(payloadBase64);
                return JSON.parse(decoded);
            }

            function extractContextFromInitData(initData) {
                const result = { userId: null, tenant: null };

                if (initData) {
                    try {
                        const params = new URLSearchParams(initData);
                        const userParam = params.get('user');
                        if (userParam) {
                            const userData = JSON.parse(decodeURIComponent(userParam));
                            if (userData?.id) {
                                console.log('[QR] telegram_user_id found (initData):', userData.id);
                                result.userId = userData.id;
                                result.tenant = String(userData.id);
                            }
                        }
                    } catch (error) {
                        console.error('[QR] Failed to parse initData:', error);
                    }
                }

                if (!result.userId) {
                    const unsafe = getInitDataUnsafe();
                    if (unsafe?.user?.id) {
                        console.log('[QR] telegram_user_id found (initDataUnsafe):', unsafe.user.id);
                        result.userId = unsafe.user.id;
                        result.tenant = String(unsafe.user.id);
                    }
                }

                return result;
            }

            async function resolveTenantContext() {
                if (tenantId) {
                    return tenantId;
                }

                const initData = getInitData();
                const extracted = extractContextFromInitData(initData);
                if (extracted.userId) {
                    telegramUserId = extracted.userId;
                }
                if (extracted.tenant) {
                    tenantId = extracted.tenant;
                    console.log('[QR] tenant_id extracted from initData / unsafe:', tenantId);
                    return tenantId;
                }

                if (!cachedAuthPayload && initData) {
                    try {
                        const authUrl = `${API_BASE || ''}/api/auth/telegram-webapp`;
                        const authResponse = await fetch(authUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ init_data: initData })
                        });
                        if (authResponse.ok) {
                            const authData = await authResponse.json();
                            try {
                                cachedAuthPayload = parseJWT(authData.access_token);
                                window.accessToken = authData.access_token;
                                if (!tenantId && cachedAuthPayload?.tenant_id) {
                                    tenantId = cachedAuthPayload.tenant_id;
                                    console.log('[QR] tenant_id extracted from JWT:', tenantId);
                                    return tenantId;
                                }
                                if (!telegramUserId && cachedAuthPayload?.sub) {
                                    telegramUserId = cachedAuthPayload.sub;
                                }
                            } catch (jwtError) {
                                console.error('[QR] Failed to parse JWT payload:', jwtError);
                            }
                        } else {
                            console.warn('[QR] /api/auth/telegram-webapp failed:', authResponse.status);
                        }
                    } catch (authError) {
                        console.error('[QR] Auth endpoint error:', authError);
                    }
                }

                if (initData) {
                    try {
                        const response = await fetch(`${API_BASE || ''}/tg/miniapp/init`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ init_data: initData })
                        });

                        if (response.ok) {
                            const data = await response.json();
                            if (data?.tenant_id) {
                                tenantId = data.tenant_id;
                                console.log('[QR] tenant_id received from /tg/miniapp/init:', tenantId);
                                return tenantId;
                            }
                        } else {
                            console.warn('[QR] /tg/miniapp/init failed:', response.status);
                        }
                    } catch (error) {
                        console.error('[QR] init endpoint error:', error);
                    }
                }

                if (!tenantId && telegramUserId) {
                    tenantId = String(telegramUserId);
                    console.log('[QR] Using telegram_user_id as tenant_id fallback:', tenantId);
                    return tenantId;
                }

                console.warn('[QR] tenant_id could not be resolved client-side');
                return null;
            }

            function updateStatus(message, type = 'loading') {
                const statusEl = document.getElementById('status');
                statusEl.textContent = message;
                statusEl.className = `status ${type}`;
            }

            function showQR() {
                const qrContainer = document.getElementById('qr-container');
                if (qrContainer) {
                    // Context7: убираем hidden класс и показываем QR
                    qrContainer.classList.remove('hidden');
                    qrContainer.classList.add('show');
                }
                const cancelBtn = document.getElementById('cancel-btn');
                if (cancelBtn) {
                    cancelBtn.classList.add('show');
                }
            }

            function hideQR() {
                const qrContainer = document.getElementById('qr-container');
                if (qrContainer) {
                    qrContainer.classList.remove('show');
                    // Context7: полностью скрываем QR контейнер чтобы он не занимал место
                    qrContainer.classList.add('hidden');
                }
                const cancelBtn = document.getElementById('cancel-btn');
                if (cancelBtn) {
                    cancelBtn.classList.remove('show');
                }
            }

            async function createSession() {
                try {
                    updateStatus('Создание сессии...', 'loading');

                    // Context7: сначала пробуем получить initData с ожиданием
                    let initData = await waitForInitData(30, 150);
                    
                    // Context7: если initData не получен, пробуем еще раз с большим количеством попыток
                    // Это важно для новых пользователей, где initData может загружаться дольше
                    if (!isValidInitData(initData)) {
                        console.warn('[QR] initData not found after first attempt, trying again with more attempts...');
                        // Проверяем, есть ли хотя бы WebApp объект
                        if (window.Telegram?.WebApp) {
                            console.log('[QR] WebApp exists, waiting longer for initData...', {
                                hasInitData: !!window.Telegram.WebApp.initData,
                                hasInitDataUnsafe: !!window.Telegram.WebApp.initDataUnsafe,
                                version: window.Telegram.WebApp.version
                            });
                            // Пробуем еще раз с большим количеством попыток
                            initData = await waitForInitData(50, 200);
                        }
                    }
                    
                    const payload = {};

                    if (isValidInitData(initData)) {
                        cachedInitData = initData;
                        const resolvedTenantId = await resolveTenantContext();
                        payload.init_data = initData;
                        if (resolvedTenantId) {
                            payload.tenant_id = resolvedTenantId;
                        }
                        console.log('[QR] Using initData for session creation, length:', initData.length);
                    } else if (fallbackToken) {
                        console.warn('[QR] initData unavailable, using fallback token');
                        updateStatus('Запуск через одноразовый токен...', 'loading');
                        payload.token = fallbackToken;
                    } else {
                        // Context7: пробуем извлечь tenant_id из initDataUnsafe как fallback
                        const unsafe = getInitDataUnsafe();
                        if (unsafe?.user?.id) {
                            const telegramUserId = unsafe.user.id;
                            const fallbackTenantId = String(telegramUserId);
                            console.warn('[QR] initData unavailable, using telegram_user_id from initDataUnsafe as tenant_id', {
                                telegram_user_id: telegramUserId,
                                tenant_id: fallbackTenantId
                            });
                            payload.tenant_id = fallbackTenantId;
                            // Context7: также пробуем построить initData из unsafe для отправки
                            const builtInitData = buildInitDataFromUnsafe(unsafe);
                            if (isValidInitData(builtInitData)) {
                                payload.init_data = builtInitData;
                                cachedInitData = builtInitData;
                                console.log('[QR] Built initData from initDataUnsafe for payload, length:', builtInitData.length);
                            }
                            updateStatus('Создание сессии...', 'loading');
                        } else {
                            // Context7: если нет никаких данных, показываем ошибку
                            console.error('[QR] No initData, no fallbackToken, no initDataUnsafe - cannot create session');
                            console.log('[QR] WebApp state:', {
                                Telegram: !!window.Telegram,
                                WebApp: !!window.Telegram?.WebApp,
                                initData: !!window.Telegram?.WebApp?.initData,
                                initDataUnsafe: !!window.Telegram?.WebApp?.initDataUnsafe,
                                version: window.Telegram?.WebApp?.version,
                                platform: window.Telegram?.WebApp?.platform
                            });
                            updateStatus('Ошибка: не удалось получить данные Telegram WebApp. Открой Mini App из Telegram.', 'error');
                            return;
                        }
                    }

                    const response = await fetch(`${API_BASE || ''}/tg/qr/start`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Cache-Control': 'no-cache, no-store, must-revalidate',
                            'Pragma': 'no-cache'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }

                    const data = await response.json();
                    sessionToken = data.session_token;

                    const url = new URL(location.href);
                    url.searchParams.set('session_id', sessionToken);
                    history.replaceState(null, '', url.toString());

                    if (data.qr_url) {
                        showQR();
                        renderQR(data.qr_url);
                        updateStatus('Отсканируйте QR-код в Telegram', 'loading');
                    } else {
                        updateStatus('Ожидание QR-кода...', 'loading');
                    }

                    return data;
                } catch (error) {
                    console.error('[QR] Create session error:', error);
                    updateStatus(`Ошибка: ${error.message}`, 'error');
                    showDebugInfo({ reason: 'create_session_error' });
                    throw error;
                }
            }

            function renderQR(qrUrl) {
                const qrCodeDiv = document.getElementById('qr-code');

                const img = document.createElement('img');
                img.style.width = '260px';
                img.style.height = '260px';
                img.style.borderRadius = '8px';
                img.style.objectFit = 'contain';

                img.onload = () => {
                    console.log('[QR] QR Code loaded successfully');
                    qrCodeDiv.innerHTML = '';
                    qrCodeDiv.appendChild(img);
                };

                img.onerror = () => {
                    console.error('[QR] QR Code load failed');
                    qrCodeDiv.innerHTML = '<div style="color: var(--tg-destructive-color); font-size: 16px;">Ошибка загрузки QR-кода</div>';
                };

                img.src = `${API_BASE}/tg/qr/png/${sessionToken}?t=${Date.now()}`;
            }

            async function checkStatus() {
                if (!sessionToken) return;

                try {
                    const response = await fetch(`${API_BASE}/tg/qr/status`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Cache-Control': 'no-cache, no-store, must-revalidate',
                            'Pragma': 'no-cache'
                        },
                        body: JSON.stringify({ session_token: sessionToken })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }

                    const data = await response.json();

                    // Context7: ВАЖНО! Обрабатываем password_required ПЕРВЫМ
                    if (data.status === 'password_required') {
                        console.log('[QR] Password required detected, showing form');
                        // Context7: не обновляем статус, так как заголовок уже есть в форме
                        hideQR();
                        
                        const passwordForm = document.getElementById('password-form');
                        const passwordInput = document.getElementById('password-input');
                        const passwordError = document.getElementById('password-error');
                        const cancelBtn = document.getElementById('cancel-btn');
                        
                        if (passwordForm) {
                            // Context7: логируем состояние ДО показа формы
                            const rectBefore = passwordForm.getBoundingClientRect();
                            console.log('[QR] Before showing form:', {
                                display: window.getComputedStyle(passwordForm).display,
                                visibility: window.getComputedStyle(passwordForm).visibility,
                                height: rectBefore.height,
                                width: rectBefore.width,
                                top: rectBefore.top,
                                left: rectBefore.left
                            });
                            
                            // Context7: показываем форму - убираем hidden класс и устанавливаем display
                            passwordForm.classList.remove('hidden');
                            passwordForm.style.display = 'block';
                            passwordForm.style.visibility = 'visible';
                            passwordForm.style.opacity = '1';
                            
                            // Context7: скрываем кнопку отмены
                            if (cancelBtn) {
                                cancelBtn.classList.remove('show');
                            }
                            
                            // Context7: логируем состояние ПОСЛЕ показа формы
                            setTimeout(() => {
                                const rectAfter = passwordForm.getBoundingClientRect();
                                console.log('[QR] After showing form:', {
                                    display: window.getComputedStyle(passwordForm).display,
                                    visibility: window.getComputedStyle(passwordForm).visibility,
                                    height: rectAfter.height,
                                    width: rectAfter.width,
                                    top: rectAfter.top,
                                    left: rectAfter.left,
                                    isVisible: rectAfter.height > 0 && rectAfter.width > 0
                                });
                                
                                // Context7: если форма все еще не видна, принудительно устанавливаем стили
                                if (rectAfter.height === 0 || rectAfter.width === 0) {
                                    console.warn('[QR] Form has zero dimensions, forcing display');
                                    passwordForm.style.display = 'block';
                                    passwordForm.style.minHeight = '200px';
                                    passwordForm.style.position = 'relative';
                                }
                            }, 100);
                            
                            // Фокус на поле ввода
                            setTimeout(() => {
                                if (passwordInput) {
                                    passwordInput.focus();
                                }
                            }, 300);
                            
                            // Context7: безопасный вызов showAlert - может не поддерживаться
                            if (window.Telegram?.WebApp && typeof window.Telegram.WebApp.showAlert === 'function') {
                                try {
                                    window.Telegram.WebApp.showAlert('Требуется пароль 2FA для завершения входа');
                                } catch (e) {
                                    console.warn('[QR] showAlert not supported:', e);
                                }
                            }
                        } else {
                            console.error('[QR] Password form not found!');
                            updateStatus('❌ Ошибка: форма пароля не найдена', 'error');
                        }
                        return; // Не обрабатываем дальше
                    }
                    
                    if (data.status === 'authorized') {
                        updateStatus('✅ Авторизация успешна!', 'success');
                        hideQR();
                        document.getElementById('password-form').style.display = 'none';
                        clearInterval(statusCheckInterval);

                        setTimeout(() => {
                            // Context7: безопасный вызов close() - может не поддерживаться
                            if (window.Telegram?.WebApp && typeof window.Telegram.WebApp.close === 'function') {
                                try {
                                    window.Telegram.WebApp.close();
                                } catch (e) {
                                    console.warn('[QR] close not supported:', e);
                                }
                            }
                        }, 2000);
                    } else if (data.status === 'failed') {
                        // Context7: показываем причину ошибки, если она есть
                        let errorMessage = '❌ Ошибка авторизации';
                        if (data.reason) {
                            // Маппинг причин ошибок на понятные сообщения
                            const reasonMessages = {
                                'password_required': 'Требуется пароль 2FA',
                                'ownership_mismatch': 'Несоответствие аккаунта',
                                'flood_wait': 'Слишком много запросов. Попробуйте позже',
                                'qr_login_error': 'Ошибка при обработке QR-кода',
                                'invalid_telegram_user': 'Неверные данные пользователя',
                                'session_store': 'Ошибка сохранения сессии',
                                'session_store_integrity_failed': 'Ошибка сохранения сессии: проблема с данными',
                                'session_store_operational_failed': 'Ошибка сохранения сессии: проблема с операцией',
                                'session_store_database_failed': 'Ошибка сохранения сессии: проблема с базой данных',
                                'session_store_unexpected_failed': 'Ошибка сохранения сессии: неожиданная ошибка',
                                'session_saver_failed': 'Ошибка сохранения сессии: проблема с сохранением'
                            };
                            const reasonKey = Object.keys(reasonMessages).find(key => data.reason.includes(key));
                            if (reasonKey) {
                                errorMessage = `❌ ${reasonMessages[reasonKey]}`;
                            } else {
                                errorMessage = `❌ Ошибка: ${data.reason}`;
                            }
                        }
                        updateStatus(errorMessage, 'error');
                        hideQR();
                        const passwordForm = document.getElementById('password-form');
                        if (passwordForm) {
                            passwordForm.style.display = 'none';
                        }
                        clearInterval(statusCheckInterval);
                    } else if (data.status === 'expired') {
                        updateStatus('⏰ Сессия истекла', 'error');
                        hideQR();
                        document.getElementById('password-form').style.display = 'none';
                        clearInterval(statusCheckInterval);
                    } else if (data.qr_url) {
                        showQR();
                        renderQR(data.qr_url);

                        if (data.status === 'awaiting_scan') {
                            updateStatus('Отсканируйте QR-код в Telegram', 'loading');
                        } else if (data.status === 'in_progress') {
                            updateStatus('Подключение к Telegram...', 'loading');
                        } else {
                            updateStatus('Готово к сканированию', 'loading');
                        }
                    } else if (data.status === 'pending') {
                        updateStatus('Ожидание QR-кода...', 'loading');
                    } else if (data.status === 'in_progress') {
                        updateStatus('Подключение к Telegram...', 'loading');
                    }
                } catch (error) {
                    console.error('[QR] Status check error:', error);
                    updateStatus(`Ошибка проверки статуса: ${error.message}`, 'error');
                    clearInterval(statusCheckInterval);
                }
            }

            // Context7: функция для отправки 2FA пароля
            async function submitPassword() {
                const passwordInput = document.getElementById('password-input');
                const passwordError = document.getElementById('password-error');
                const btnSubmit = document.getElementById('btn-submit-password');
                
                const password = passwordInput.value.trim();
                if (!password) {
                    passwordError.textContent = 'Введите пароль';
                    passwordError.style.display = 'block';
                    return;
                }
                
                if (!sessionToken) {
                    passwordError.textContent = 'Ошибка: сессия не найдена';
                    passwordError.style.display = 'block';
                    return;
                }
                
                try {
                    passwordError.style.display = 'none';
                    btnSubmit.disabled = true;
                    btnSubmit.textContent = 'Отправка...';
                    
                    const response = await fetch(`${API_BASE || ''}/tg/qr/password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            session_token: sessionToken,
                            password: password
                        })
                    });
                    
                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({ detail: 'Ошибка при отправке пароля' }));
                        throw new Error(errorData.detail || 'Ошибка при отправке пароля');
                    }
                    
                    const data = await response.json();
                    console.log('[QR] Password submission response:', data);
                    
                    if (data.status === 'authorized') {
                        updateStatus('✅ Пароль принят, завершение авторизации...', 'success');
                        document.getElementById('password-form').style.display = 'none';
                        
                        // Продолжаем проверять статус
                        if (!statusCheckInterval) {
                            statusCheckInterval = setInterval(checkStatus, 2000);
                        }
                    } else {
                        throw new Error(data.message || 'Неизвестная ошибка');
                    }
                } catch (error) {
                    console.error('[QR] Password submission error:', error);
                    
                    // Context7: проверяем, не связана ли ошибка с WebAppMethodUnsupported
                    let errorMessage = error.message || 'Ошибка при отправке пароля';
                    
                    // Context7: обрабатываем разные типы ошибок
                    if (errorMessage.includes('WebAppMethodUnsupported') || errorMessage.includes('MethodUnsupported')) {
                        console.warn('[QR] WebAppMethodUnsupported detected, this is a non-critical WebApp API error');
                        errorMessage = 'Ошибка при отправке пароля. Попробуйте еще раз.';
                    } else if (errorMessage.includes('internal error') || errorMessage.includes('server') || errorMessage.includes('500')) {
                        // Context7: внутренние ошибки сервера - показываем понятное сообщение
                        errorMessage = 'Временная ошибка сервера. Попробуйте еще раз через несколько секунд.';
                    } else if (errorMessage.includes('Invalid password') || errorMessage.includes('неверный')) {
                        errorMessage = 'Неверный пароль. Проверьте и попробуйте снова.';
                    } else if (errorMessage.includes('expired') || errorMessage.includes('истек')) {
                        errorMessage = 'Сессия истекла. Начните авторизацию заново.';
                    }
                    
                    passwordError.textContent = errorMessage;
                    passwordError.style.display = 'block';
                    passwordInput.value = '';
                    passwordInput.focus();
                } finally {
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = 'Отправить пароль';
                }
            }

            async function cancelAuth() {
                if (sessionToken) {
                    try {
                        await fetch(`${API_BASE || ''}/tg/qr/cancel`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ session_token: sessionToken })
                        });
                    } catch (error) {
                        console.error('[QR] Cancel auth error:', error);
                    }
                }

                hideQR();
                document.getElementById('password-form').style.display = 'none';
                updateStatus('Авторизация отменена', 'loading');
                clearInterval(statusCheckInterval);
            }

            document.addEventListener('DOMContentLoaded', async () => {
                // Context7: инициализируем WebApp и ждем полной загрузки
                initTelegramWebApp();

                // Context7: безопасная проверка isReady - может не поддерживаться
                if (window.Telegram && window.Telegram.WebApp) {
                    await new Promise(resolve => {
                        // Context7: isReady может не существовать в старых версиях
                        if (window.Telegram.WebApp.isReady !== undefined && window.Telegram.WebApp.isReady) {
                            resolve();
                        } else {
                            // Context7: безопасный вызов ready()
                            if (typeof window.Telegram.WebApp.ready === 'function') {
                                try {
                                    window.Telegram.WebApp.ready();
                                } catch (e) {
                                    console.warn('[QR] ready() error:', e);
                                }
                            }
                            setTimeout(resolve, 200);
                        }
                    });
                    
                    // Context7: даем время для инициализации initData после ready()
                    await new Promise(resolve => setTimeout(resolve, 200));
                } else {
                    // Context7: если WebApp не загружен, ждем его появления
                    await new Promise(resolve => {
                        const checkInterval = setInterval(() => {
                            if (window.Telegram?.WebApp) {
                                clearInterval(checkInterval);
                                initTelegramWebApp();
                                setTimeout(resolve, 300);
                            }
                        }, 50);
                        setTimeout(() => {
                            clearInterval(checkInterval);
                            resolve();
                        }, 2000);
                    });
                }

                // Context7: добавляем обработчик для кнопки отправки пароля
                const btnSubmitPassword = document.getElementById('btn-submit-password');
                const passwordInput = document.getElementById('password-input');
                
                if (btnSubmitPassword) {
                    btnSubmitPassword.addEventListener('click', submitPassword);
                }
                
                if (passwordInput) {
                    passwordInput.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') {
                            submitPassword();
                        }
                    });
                }

                const urlParams = new URLSearchParams(location.search);
                const existingSessionId = urlParams.get('session_id');

                if (existingSessionId) {
                    sessionToken = existingSessionId;
                    updateStatus('Проверка сессии...', 'loading');
                    showQR();
                    statusCheckInterval = setInterval(checkStatus, 2000);
                } else {
                    try {
                        await createSession();
                        statusCheckInterval = setInterval(checkStatus, 2000);
                    } catch (error) {
                        console.error('[QR] Initialization error:', error);
                    }
                }
            });

            window.addEventListener('beforeunload', () => {
                if (statusCheckInterval) {
                    clearInterval(statusCheckInterval);
                }
            });

            window.cancelAuth = cancelAuth;
        })();
    </script>
</body>
</html>
