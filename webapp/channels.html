<!-- [C7-ID: MINIAPP-UI-001] -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои каналы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/css/miniapp.css">
    <style>
        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        
        .quota {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            color: var(--tg-theme-hint-color, #666666);
        }
        
        .search-bar {
            margin-bottom: 20px;
        }
        
        .search-bar input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--tg-theme-hint-color, #cccccc);
            border-radius: 12px;
            background: var(--tg-theme-secondary-bg-color, #f8f8f8);
            color: var(--tg-theme-text-color, #000000);
            font-size: 16px;
        }
        
        .search-bar input:focus {
            outline: none;
            border-color: var(--tg-theme-button-color, #007aff);
        }
        
        .channels-list {
            margin-bottom: 20px;
        }
        
        .channel-card {
            background: var(--tg-theme-secondary-bg-color, #f8f8f8);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .channel-info h3 {
            margin: 0 0 4px 0;
            font-size: 16px;
            font-weight: 600;
        }
        
        .channel-info p {
            margin: 0;
            font-size: 14px;
            color: var(--tg-theme-hint-color, #666666);
        }
        
        .channel-actions {
            display: flex;
            gap: 8px;
        }
        
        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        .btn:hover {
            opacity: 0.8;
        }
        
        .btn-danger {
            background: #ff3b30;
            color: white;
        }
        
        .btn-secondary {
            background: var(--tg-theme-hint-color, #cccccc);
            color: var(--tg-theme-text-color, #000000);
        }
        
        .add-btn {
            width: 100%;
            padding: 16px;
            background: var(--tg-theme-button-color, #007aff);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        .add-btn:hover {
            opacity: 0.8;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }
        
        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: var(--tg-theme-bg-color, #ffffff);
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
        }
        
        .modal-content h2 {
            margin: 0 0 16px 0;
            font-size: 20px;
        }
        
        .modal-content input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--tg-theme-hint-color, #cccccc);
            border-radius: 12px;
            background: var(--tg-theme-secondary-bg-color, #f8f8f8);
            color: var(--tg-theme-text-color, #000000);
            font-size: 16px;
            margin-bottom: 16px;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        
        .modal-actions button {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .modal-actions button:first-child {
            background: var(--tg-theme-button-color, #007aff);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
        
        .modal-actions button:last-child {
            background: var(--tg-theme-hint-color, #cccccc);
            color: var(--tg-theme-text-color, #000000);
        }
        
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--tg-theme-secondary-bg-color, #f8f8f8);
            color: var(--tg-theme-text-color, #000000);
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 1001;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .toast.show {
            opacity: 1;
        }
        
        .toast.success {
            background: #34c759;
            color: white;
        }
        
        .toast.error {
            background: #ff3b30;
            color: white;
        }
        
        .toast.warning {
            background: #ff9500;
            color: white;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--tg-theme-hint-color, #666666);
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--tg-theme-hint-color, #666666);
        }
        
        .empty-state h3 {
            margin: 0 0 8px 0;
            font-size: 18px;
        }
        
        .empty-state p {
            margin: 0;
            font-size: 14px;
        }
        
        /* Переключатель вида */
        .view-switcher {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            background: var(--tg-theme-secondary-bg-color, #f8f8f8);
            padding: 4px;
            border-radius: 12px;
        }
        
        .view-btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--tg-theme-text-color, #000000);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .view-btn.active {
            background: var(--tg-theme-button-color, #007aff);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
        
        .view-btn:hover:not(.active) {
            background: var(--tg-theme-hint-color, #cccccc);
            opacity: 0.7;
        }
        
        /* Секции каналов */
        .channels-section {
            margin-bottom: 24px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 12px 0;
            color: var(--tg-theme-text-color, #000000);
            padding: 8px 0;
            border-bottom: 1px solid var(--tg-theme-hint-color, #cccccc);
        }
        
        /* Бейджи источников */
        .channel-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 4px;
        }
        
        .channel-header h3 {
            flex: 1;
            margin: 0;
        }
        
        .channel-badges {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        
        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
        }
        
        .badge-manual {
            background: #34c759;
            color: white;
        }
        
        .badge-theme {
            background: #007aff;
            color: white;
        }
        
        .channel-hint {
            margin: 8px 0 0 0;
            font-size: 12px;
            color: var(--tg-theme-hint-color, #666666);
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <h1>📺 Мои каналы</h1>
            <div class="quota">
                <span id="quota-text">Загрузка...</span>
            </div>
        </div>
        
        <!-- Переключатель вида -->
        <div class="view-switcher">
            <button class="view-btn active" data-view="all" onclick="switchView('all')">
                Все
            </button>
            <button class="view-btn" data-view="manual" onclick="switchView('manual')">
                📝 Вручную
            </button>
            <button class="view-btn" data-view="theme" onclick="switchView('theme')">
                📚 Подборки
            </button>
        </div>
        
        <div class="search-bar">
            <input type="text" id="search" placeholder="🔍 Поиск по каналам...">
        </div>
        
        <div id="channels-list">
            <div class="loading">Загрузка каналов...</div>
        </div>
        
        <button class="add-btn" onclick="showAddModal()">
            ➕ Добавить канал
        </button>
        
        <!-- Modal для добавления канала -->
        <div id="add-modal" class="modal">
            <div class="modal-content">
                <h2>Добавить канал</h2>
                <input type="text" id="channel-username" placeholder="@channel_name" maxlength="32">
                <div class="modal-actions">
                    <button onclick="addChannel()">Добавить</button>
                    <button onclick="closeModal()">Отмена</button>
                </div>
            </div>
        </div>
        
        <div id="toast" class="toast"></div>
    </div>
    
    <script src="/static/js/channels.js"></script>
</body>
</html>
